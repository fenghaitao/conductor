# Simple Question-Answering Workflow — provider profiles (BYOK)
#
# This example demonstrates switching the model backend at runtime with a
# provider profile file via `-p`. The workflow carries NO endpoint or
# credentials itself — base_url / api_key / type (and default_model) all come
# from the profile you pass on the command line. Switching DeepSeek <-> Ark is
# a one-word change with no edits to this file.
#
# Run against DeepSeek (direct):
#   export DEEPSEEK_API_KEY=sk-...
#   conductor run examples/simple-qa-ds.yaml \
#     -p examples/providers/copilot-deepseek.yaml \
#     --input question="What is Python?"
#
# Run the SAME workflow against Volcengine Ark:
#   export VOLCES_ARK_API_KEY=...
#   conductor run examples/simple-qa-ds.yaml \
#     -p examples/providers/copilot-ark.yaml \
#     --input question="What is Python?"
#
# `-p` also still accepts a bare provider name (e.g. `-p copilot`).

workflow:
  name: simple-qa-ds
  description: Question-answering workflow whose backend is chosen via a -p profile
  version: "1.0.0"
  entry_point: answerer

  runtime:
    # Provider routing (base_url / api_key / type) and default_model are
    # supplied by the `-p <profile>` file at runtime — see the header.
    # temperature is provider-agnostic, so it stays here.
    temperature: 0.7

  input:
    question:
      type: string
      required: true
      description: The question to answer

agents:
  - name: answerer
    description: Answers the user's question clearly and concisely
    prompt: |
      You are a helpful assistant. Please answer the following question
      clearly and concisely:

      Question: {{ workflow.input.question }}

      Provide a direct answer without unnecessary preamble.
    output:
      answer:
        type: string
        description: The answer to the question
      confidence:
        type: string
        description: Confidence level (high, medium, low)
    routes:
      - to: $end

output:
  answer: "{{ answerer.output.answer }}"
  confidence: "{{ answerer.output.confidence }}"
