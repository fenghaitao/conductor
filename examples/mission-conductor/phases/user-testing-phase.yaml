# User Testing Phase
#
# Auto-injected quality gate after scrutiny passes for each milestone.
# Tests pending VAL-* assertions through REAL user surfaces.
# Updates validation-state.yaml with pass/fail results.
# Failed assertions → fix features injected into features.yaml.
#
# Gap #4: E2E validation is the DEFAULT. Mocks are a conscious opt-out
# requiring explicit user approval — not a silent fallback.
# Gap #8: Resource-aware concurrency — reads readiness-report.yaml
# (written by readiness-check.yaml) to set max_concurrent safely.
#
# Steps:
#   1. collect_assertions  — script: get pending assertions for this milestone
#   2. check_resources     — script: read readiness-report.yaml for concurrency limit
#   3. test_assertions     — for_each (parallel groups): LLM tests each assertion group
#   4. update_state        — script: write pass/fail to validation-state.yaml
#   5. inject_fix_features — script: for failed assertions, add fix features to features.yaml

workflow:
  name: mission-user-testing-phase
  description: Test VAL-* assertions through real user surfaces for a milestone
  version: "1.0.0"
  entry_point: collect_assertions

  runtime:
    provider: copilot
    default_model: claude-sonnet-4.6

  input:
    mission_dir:
      type: string
      required: true
    milestone:
      type: string
      required: true

  context:
    mode: accumulate

  limits:
    max_iterations: 80

for_each:
  # ── Step 3 (for_each parallel) ──────────────────────────────────────────────
  - name: test_assertions
    type: for_each
    description: |
      Test each assertion group concurrently. Each group targets one contract area.
      Uses the tool specified in the assertion (agent-browser, curl, exec).
      Concurrency limit comes from readiness-report.yaml (gap #8).
    source: collect_assertions.output.assertion_groups
    as: group
    max_concurrent: 2
    failure_mode: continue_on_error

    agent:
      name: test_one_group
      model: claude-sonnet-4.6
      description: Test assertions for one contract area
      tools: null
      prompt: |
        Test these validation contract assertions for area "{{ group.group_id }}".

        WORKING DIRECTORY: {{ collect_assertions.output.working_directory }}
        SERVICES:
        {{ collect_assertions.output.services_yaml }}

        TESTING GUIDANCE (from AGENTS.md):
        {{ collect_assertions.output.agents_md }}

        ASSERTIONS TO TEST:
        {% for a in group.assertions %}
        {{ a.text }}
        {% endfor %}

        ══════════════════════════════════════════════════════
        E2E VALIDATION POLICY (CRITICAL)
        ══════════════════════════════════════════════════════
        DEFAULT: Test through REAL integrations — real database, real API, real browser.
        DO NOT substitute mocks, stubs, or fakes unless the user has explicitly requested it.

        If a real dependency appears unavailable:
        1. Attempt to start it using services.yaml commands
        2. If startup fails, report status "blocked" with exact error
        3. DO NOT silently switch to mocks — that hides real failures

        Setting status "blocked" is the correct response when E2E testing is impossible.
        A blocked assertion is NOT a passed assertion.
        ══════════════════════════════════════════════════════

        For each assertion:
        1. Start required services if not running (use services.yaml start command only)
        2. Test through the REAL user surface specified in the assertion's Tool field
        3. Collect the evidence specified in the Evidence field
        4. Determine pass/fail/blocked with a clear reason

        VERIFICATION HYGIENE:
        - Do NOT pipe test output through `| tail`, `| head`, or `| grep` — this masks exit codes
        - If you need less output, run a narrower test target instead
        - Always capture the actual exit code of each command

        Output results as YAML:
        ```yaml
        group_id: "{{ group.group_id }}"
        results:
          - id: "VAL-XXX-001"
            status: pass | fail | blocked
            reason: "<what you observed>"
            evidence: "<screenshots taken, commands run with exit codes, responses received>"
        ```

        Status meanings:
        - pass: behavior confirmed as specified via real integration
        - fail: behavior does not match specification (real bug found)
        - blocked: cannot test E2E — prerequisite service unavailable after startup attempt
      output:
        results_yaml:
          type: string

    routes:
      - to: update_state

agents:
  # ── Step 1 ──────────────────────────────────────────────────────────────────
  - name: collect_assertions
    type: script
    description: |
      Collect pending VAL-* assertion IDs for features in this milestone.
      Groups assertions by area for parallel testing (2-5 per group).
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, re, sys
        from ruamel.yaml import YAML

        mission_dir = pathlib.Path(sys.argv[1])
        milestone = sys.argv[2]
        yaml = YAML()

        # Get assertion IDs claimed by completed features in this milestone
        features_data = yaml.load((mission_dir / "features.yaml").read_text())
        milestone_assertion_ids = set()
        for f in features_data.get("features", []):
            if (f.get("milestone") == milestone and
                f.get("status") == "completed" and
                not f.get("skill_name", "").startswith("scrutiny-") and
                not f.get("skill_name", "").startswith("user-testing-")):
                for vid in f.get("fulfills", []):
                    milestone_assertion_ids.add(vid)

        # Filter to only pending assertions
        state_path = mission_dir / "validation-state.yaml"
        state = yaml.load(state_path.read_text()) if state_path.exists() else {}
        pending_ids = [
            vid for vid in milestone_assertion_ids
            if state.get(vid, "pending") == "pending"
        ]

        if not pending_ids:
            print(json.dumps({
                "state": "all_done",
                "assertion_groups": [],
                "contract_md": "",
                "services_yaml": "",
                "working_directory": "",
                "agents_md": "",
            }))
            sys.exit(0)

        # Parse the full assertion text for each pending ID
        contract_path = mission_dir / "validation-contract.md"
        contract_text = contract_path.read_text() if contract_path.exists() else ""

        def extract_assertion(vid, text):
            """Extract full assertion block for a VAL-* ID."""
            pattern = rf"(### {re.escape(vid)}:.*?)(?=### VAL-|## |$)"
            m = re.search(pattern, text, re.DOTALL)
            return m.group(1).strip() if m else f"### {vid}: (not found in contract)"

        # Extract tool from assertion text
        def get_tool(assertion_text):
            m = re.search(r"Tool:\s*(\S+)", assertion_text)
            return m.group(1) if m else "exec"

        assertions = [
            {
                "id": vid,
                "text": extract_assertion(vid, contract_text),
                "tool": get_tool(extract_assertion(vid, contract_text)),
            }
            for vid in pending_ids
        ]

        # Group by area prefix (VAL-AUTH-001 → AUTH) for parallel testing
        groups = {}
        for a in assertions:
            m = re.match(r"VAL-([A-Z]+)-\d+", a["id"])
            area = m.group(1) if m else "MISC"
            groups.setdefault(area, []).append(a)

        # Convert to list of groups for for_each
        assertion_groups = [
            {"group_id": area, "assertions": items}
            for area, items in groups.items()
        ]

        def read(p): return p.read_text() if p.exists() else ""
        wd = read(mission_dir / "working_directory.txt").strip()

        print(json.dumps({
            "state": "ready",
            "assertion_groups": assertion_groups,
            "contract_md": contract_text,
            "services_yaml": read(mission_dir / "services.yaml"),
            "working_directory": wd,
            "agents_md": read(mission_dir / "AGENTS.md"),
        }))
      - "{{ workflow.input.mission_dir }}"
      - "{{ workflow.input.milestone }}"
    output:
      state:             { type: string }
      assertion_groups:  { type: array }
      contract_md:       { type: string }
      services_yaml:     { type: string }
      working_directory: { type: string }
      agents_md:         { type: string }
    routes:
      - to: $end
        when: "state == 'all_done'"
      - to: check_resources

  # ── Step 2 ──────────────────────────────────────────────────────────────────
  - name: check_resources
    type: script
    description: |
      Read readiness-report.yaml (written by readiness-check.yaml) to get the
      resource-calibrated max_concurrent for this machine. Falls back to 2.
      (Gap #8: resource cost classification)
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, sys
        from ruamel.yaml import YAML
        mission_dir = pathlib.Path(sys.argv[1])
        report_path = mission_dir / "readiness-report.yaml"
        max_concurrent = 2  # safe default
        if report_path.exists():
            try:
                yaml = YAML()
                report = yaml.load(report_path.read_text())
                rec = report.get("resource_assessment", {}).get("recommended_max_concurrent")
                if isinstance(rec, int) and 1 <= rec <= 5:
                    max_concurrent = rec
            except Exception:
                pass
        print(json.dumps({"max_concurrent": max_concurrent}))
      - "{{ workflow.input.mission_dir }}"
    output:
      max_concurrent: { type: number }
    routes:
      - to: test_assertions

  # ── Step 4 ──────────────────────────────────────────────────────────────────
  - name: update_state
    type: script
    description: |
      Parse all group results and update validation-state.yaml.
      Write per-milestone testing report.
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, sys
        from ruamel.yaml import YAML

        mission_dir = pathlib.Path(sys.argv[1])
        milestone = sys.argv[2]

        yaml = YAML()
        yaml.preserve_quotes = True

        # Load current state
        state_path = mission_dir / "validation-state.yaml"
        state = yaml.load(state_path.read_text()) if state_path.exists() else {}

        # Read all group result files from the for_each outputs
        # (We read the context accumulated from test_assertions)
        # Since results are in agent outputs, we parse from the context
        # stored in the for_each — handled by collecting from handoff dir
        results_dir = mission_dir / "validation" / milestone / "user-testing"
        results_dir.mkdir(parents=True, exist_ok=True)

        passed, failed, blocked = [], [], []

        # Scan handoffs directory for testing results written by test_one_group
        for result_file in (mission_dir / "validation" / milestone / "user-testing").glob("*.yaml"):
            try:
                data = yaml.load(result_file.read_text())
                for r in data.get("results", []):
                    vid = r.get("id", "")
                    status = r.get("status", "blocked")
                    if status == "pass":
                        passed.append(vid)
                    elif status == "fail":
                        failed.append(vid)
                    else:
                        blocked.append(vid)
            except Exception:
                pass

        # Update state
        for vid in passed:
            state[vid] = "passed"
        for vid in failed:
            state[vid] = "failed"

        with open(state_path, "w") as f:
            yaml.dump(state, f)

        print(json.dumps({
            "passed": passed,
            "failed": failed,
            "blocked": blocked,
            "testing_passed": len(failed) == 0,
        }))
      - "{{ workflow.input.mission_dir }}"
      - "{{ workflow.input.milestone }}"
    output:
      passed:         { type: array }
      failed:         { type: array }
      blocked:        { type: array }
      testing_passed: { type: boolean }
    routes:
      - to: $end
        when: "testing_passed == true"
      - to: inject_fix_features
        when: "testing_passed == false"

  # ── Step 5 ──────────────────────────────────────────────────────────────────
  - name: inject_fix_features
    type: script
    description: |
      For each failed assertion, add a fix feature to features.yaml
      so the run loop will implement the fix before re-testing.
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, sys
        from ruamel.yaml import YAML

        mission_dir = pathlib.Path(sys.argv[1])
        milestone = sys.argv[2]
        failed_ids = json.loads(sys.argv[3])

        if not failed_ids:
            print(json.dumps({"injected": 0}))
            sys.exit(0)

        yaml = YAML()
        yaml.preserve_quotes = True
        features_path = mission_dir / "features.yaml"
        data = yaml.load(features_path.read_text())
        features = data.get("features", [])

        # Find the highest feature ID for this milestone
        milestone_ids = [
            f["id"] for f in features
            if f.get("milestone") == milestone and "." in str(f.get("id", ""))
        ]
        if milestone_ids:
            ms_num = str(milestone_ids[0]).split(".")[0]
            max_sub = max(int(str(fid).split(".")[1]) for fid in milestone_ids)
        else:
            ms_num = "99"
            max_sub = 0

        # Find original feature descriptions for context
        original_features = {
            vid: next(
                (f for f in features if vid in f.get("fulfills", [])),
                None
            )
            for vid in failed_ids
        }

        injected = 0
        for i, vid in enumerate(failed_ids):
            orig = original_features.get(vid)
            orig_desc = orig.get("description", "unknown feature") if orig else "unknown feature"
            skill = orig.get("skill_name", "backend-worker") if orig else "backend-worker"

            fix_id = f"{ms_num}.{max_sub + i + 1}"
            fix_feature = {
                "id": fix_id,
                "milestone": milestone,
                "description": f"Fix failing assertion {vid} (originally in: {orig_desc})",
                "skill_name": skill,
                "expected_behavior": f"Assertion {vid} passes user testing",
                "fulfills": [vid],
                "status": "pending",
                "worker_session_id": "",
            }
            features.append(fix_feature)
            injected += 1

        data["features"] = features
        with open(features_path, "w") as f:
            yaml.dump(data, f)

        print(json.dumps({"injected": injected, "fix_feature_ids": [
            f"{ms_num}.{max_sub + i + 1}" for i in range(len(failed_ids))
        ]}))
      - "{{ workflow.input.mission_dir }}"
      - "{{ workflow.input.milestone }}"
      - "{{ update_state.output.failed | tojson }}"
    output:
      injected:        { type: number }
      fix_feature_ids: { type: array }
    routes:
      - to: $end

output:
  testing_passed: "{{ update_state.output.testing_passed | default(true) }}"
  passed_count:   "{{ update_state.output.passed | length | default(0) }}"
  failed_count:   "{{ update_state.output.failed | length | default(0) }}"
