# Orchestrator Review Phase
#
# Triggered when a worker sets return_to_orchestrator: true in its handoff,
# or when multiple features in a milestone repeatedly fail scrutiny/testing.
#
# The orchestrator LLM reviews all pending handoff issues and decides:
#   - Update guidance in AGENTS.md / features.yaml and continue
#   - Escalate to user via human gate for a decision
#   - Dismiss a non-issue and continue
#
# Steps:
#   1. load_issues      — script: collect all return_to_orchestrator handoffs
#   2. triage           — LLM: assess each issue and decide action
#   3. apply_updates    — script: apply automated actions (update features.yaml, AGENTS.md)
#   4. user_escalation  — human gate (only when triage decides escalation is needed)

workflow:
  name: mission-orchestrator-review
  description: Review worker handoff issues and decide how to proceed
  version: "1.0.0"
  entry_point: load_issues

  runtime:
    provider: copilot
    default_model: claude-sonnet-4.6

  input:
    mission_dir:
      type: string
      required: true
    milestone:
      type: string
      required: false
      description: Current milestone context (optional)

  context:
    mode: accumulate

agents:
  # ── Step 1 ──────────────────────────────────────────────────────────────────
  - name: load_issues
    type: script
    description: Collect all handoffs with return_to_orchestrator=true
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, sys
        from ruamel.yaml import YAML

        mission_dir = pathlib.Path(sys.argv[1])
        yaml = YAML()

        # Find handoffs where return_to_orchestrator is true
        issues = []
        handoffs_dir = mission_dir / "handoffs"
        if handoffs_dir.exists():
            for f in sorted(handoffs_dir.glob("*.yaml")):
                try:
                    data = yaml.load(f.read_text())
                    if data.get("return_to_orchestrator"):
                        issues.append({
                            "feature_id": data.get("feature_id", f.stem),
                            "salient_summary": data.get("salient_summary", ""),
                            "what_was_left_undone": data.get("what_was_left_undone", ""),
                            "discovered_issues": data.get("discovered_issues", []),
                        })
                except Exception:
                    pass

        def read(p): return p.read_text() if p.exists() else ""
        print(json.dumps({
            "issues": issues,
            "state": "ready" if issues else "no_issues",
            "mission_md": read(mission_dir / "mission.md"),
            "agents_md": read(mission_dir / "AGENTS.md"),
            "features_yaml": read(mission_dir / "features.yaml"),
        }))
      - "{{ workflow.input.mission_dir }}"
    output:
      issues:        { type: array }
      state:         { type: string }
      mission_md:    { type: string }
      agents_md:     { type: string }
      features_yaml: { type: string }
    routes:
      - to: $end
        when: "state == 'no_issues'"
      - to: triage

  # ── Step 2 ──────────────────────────────────────────────────────────────────
  - name: triage
    model: claude-sonnet-4.6
    description: |
      Assess each issue and decide the appropriate action:
      - update_guidance: fix AGENTS.md or feature description and continue
      - reset_feature: put the feature back to pending with updated description
      - dismiss: non-issue, continue without changes
      - escalate: requires user decision
    prompt: |
      You are the mission orchestrator reviewing worker handoff issues.

      MISSION:
      {{ load_issues.output.mission_md }}

      CURRENT AGENTS.MD:
      {{ load_issues.output.agents_md }}

      CURRENT FEATURES:
      {{ load_issues.output.features_yaml }}

      ISSUES TO TRIAGE:
      {{ load_issues.output.issues | tojson }}

      For each issue, decide:
      - **update_guidance**: The worker hit an ambiguity in guidance. Propose new text
        for AGENTS.md or the feature description to prevent recurrence. Continue run.
      - **reset_feature**: The feature needs to be re-attempted with a better description.
        Propose the updated feature description.
      - **dismiss**: This is a non-issue (already tracked, truly irrelevant).
        Provide a minimum 20-character justification.
      - **escalate**: This requires a user decision (blocked on credentials, scope change,
        fundamental architecture conflict, etc.). Summarize what the user needs to decide.

      KNOWLEDGE TRIAGE FRAMEWORK (gap #10):
      Also identify any knowledge surfaced in the issues that belongs in a specific place.
      Use first-principles to route it correctly:
      - **services.yaml**: operational facts with start/stop/port/healthcheck
        (e.g. worker discovered Redis uses port 6380, not 6379)
      - **library/<area>.md**: factual discoveries — env var names, API quirks, SDK patterns,
        path conventions that future workers need (NOT normative guidance)
      - **AGENTS.md**: normative guidance — rules the orchestrator wants all workers to follow
        (e.g. all DB calls must go through repository layer)
      - **skills/<skill-name>/SKILL.md**: procedural improvements to a specific skill
        (e.g. step 3 was unclear about migration ordering)

      Output YAML:
      ```yaml
      needs_escalation: true | false
      escalation_summary: "<summary for user — only if needs_escalation is true>"
      actions:
        - feature_id: "1.1"
          action: update_guidance | reset_feature | dismiss | escalate
          justification: "<why this action>"
          # For update_guidance:
          agents_md_addition: "<text to append to AGENTS.md>"
          # For reset_feature:
          new_feature_description: "<updated description>"
          # For dismiss:
          dismiss_reason: "<20+ char reason>"
      knowledge_updates:
        - destination: services.yaml | library | AGENTS.md | skills
          path_suffix: "<e.g. library/payment-api.md or skills/backend-worker/SKILL.md>"
          content: "<text to write or append>"
          operation: append | create
          rationale: "<why this belongs here>"
      ```
    output:
      triage_yaml:
        type: string
    routes:
      - to: apply_updates

  # ── Step 3 ──────────────────────────────────────────────────────────────────
  - name: apply_updates
    type: script
    description: |
      Apply automated actions: update AGENTS.md, reset features to pending,
      mark dismissed items. Parse triage YAML and execute changes.
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, sys
        from ruamel.yaml import YAML

        mission_dir = pathlib.Path(sys.argv[1])
        triage_yaml = sys.argv[2]

        yaml = YAML()
        yaml.preserve_quotes = True

        try:
            triage = yaml.load(triage_yaml)
        except Exception:
            print(json.dumps({"applied": 0, "needs_escalation": False, "escalation_summary": ""}))
            sys.exit(0)

        needs_escalation = triage.get("needs_escalation", False)
        escalation_summary = triage.get("escalation_summary", "")
        actions = triage.get("actions", [])

        applied = 0
        agents_md_path = mission_dir / "AGENTS.md"
        features_path = mission_dir / "features.yaml"
        features_data = yaml.load(features_path.read_text())

        for action in actions:
            a_type = action.get("action")
            feature_id = action.get("feature_id", "")

            if a_type == "update_guidance":
                addition = action.get("agents_md_addition", "")
                if addition and agents_md_path.exists():
                    current = agents_md_path.read_text()
                    agents_md_path.write_text(current + "\n\n" + addition)
                    applied += 1

            elif a_type == "reset_feature":
                new_desc = action.get("new_feature_description", "")
                for f in features_data.get("features", []):
                    if f.get("id") == feature_id:
                        f["status"] = "pending"
                        if new_desc:
                            f["description"] = new_desc
                        applied += 1
                        break

            elif a_type == "dismiss":
                applied += 1  # nothing to write, just acknowledge

        with open(features_path, "w") as fp:
            yaml.dump(features_data, fp)

        # Apply knowledge updates (gap #10: triage framework)
        knowledge_updates = triage.get("knowledge_updates", [])
        knowledge_applied = 0
        for ku in knowledge_updates:
            path_suffix = ku.get("path_suffix", "")
            content = ku.get("content", "").strip()
            operation = ku.get("operation", "append")
            if not path_suffix or not content:
                continue
            target_path = mission_dir / path_suffix
            target_path.parent.mkdir(parents=True, exist_ok=True)
            if operation == "create" or not target_path.exists():
                target_path.write_text(content + "\n")
            else:
                existing = target_path.read_text()
                if content[:80] not in existing:
                    target_path.write_text(existing + "\n\n" + content + "\n")
            knowledge_applied += 1

        print(json.dumps({
            "applied": applied,
            "needs_escalation": needs_escalation,
            "escalation_summary": escalation_summary,
            "knowledge_applied": knowledge_applied,
        }))
      - "{{ workflow.input.mission_dir }}"
      - "{{ triage.output.triage_yaml }}"
    output:
      applied:             { type: number }
      needs_escalation:    { type: boolean }
      escalation_summary:  { type: string }
      knowledge_applied:   { type: number }
    routes:
      - to: $end
        when: "needs_escalation == false"
      - to: user_escalation
        when: "needs_escalation == true"

  # ── Step 4 (conditional) ────────────────────────────────────────────────────
  - name: user_escalation
    type: human_gate
    description: Present escalated issues to user for a decision
    prompt: |
      ## Mission Orchestrator Needs Your Input

      {{ apply_updates.output.escalation_summary }}

      Please provide guidance on how to proceed. You can:
      - Clarify the requirement or constraint
      - Provide missing credentials or configuration
      - Approve a scope change
      - Ask to skip a blocked feature for now
    options:
      - label: "Submit guidance"
        value: submitted
        route: $end
        prompt_for: guidance

output:
  review_complete:    "true"
  needs_escalation:   "{{ apply_updates.output.needs_escalation | default(false) }}"
