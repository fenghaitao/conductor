# Volcengine Ark (DeepSeek served via Ark) via the native Claude / Anthropic provider.
#
# Pass to any workflow with:  -p examples/providers/claude-ark.yaml
#
# Identical shape to claude-deepseek.yaml — just point base_url at Ark and set
# api_key from $VOLCES_ARK_API_KEY. Ark authenticates with `Authorization:
# Bearer <key>` (it rejects `x-api-key` with HTTP 401), so the claude provider
# detects the Ark endpoint and automatically sends the api_key as a Bearer
# token instead of x-api-key. No special env vars required.
#
# The Agent Plan anthropic-compatible endpoint lives under /api/plan (the client
# appends /v1/messages). The OpenAI-compatible equivalent is /api/plan/v3.
provider:
  name: claude
  type: anthropic
  base_url: https://ark.cn-beijing.volces.com/api/plan
  api_key: ${VOLCES_ARK_API_KEY:-your-api-key-here}
default_model: deepseek-v4-pro
