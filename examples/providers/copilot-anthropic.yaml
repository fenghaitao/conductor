# Anthropic (direct) provider profile — copilot provider.
#
# Pass to any workflow with:  -p examples/providers/copilot-anthropic.yaml
#
# Sends requests to the official Anthropic Messages API using the copilot
# provider's anthropic wire. The api_key is read from $ANTHROPIC_API_KEY so the
# secret never lands in this file (or in checkpoints / event logs).
# default_model only fills agents that omit an explicit `model:`.
provider:
  name: copilot
  type: anthropic
  base_url: https://api.anthropic.com
  api_key: ${ANTHROPIC_API_KEY:-your-api-key-here}
default_model: claude-sonnet-4-6
