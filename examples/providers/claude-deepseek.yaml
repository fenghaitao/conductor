# DeepSeek (direct) via the native Claude / Anthropic provider.
#
# Pass to any workflow with:  -p examples/providers/claude-deepseek.yaml
#
# Same DeepSeek anthropic-wire endpoint as deepseek.yaml, but routed through
# Conductor's `claude` provider (Anthropic SDK) instead of `copilot`. The
# api_key is sent as the `x-api-key` header, which DeepSeek's /anthropic API
# accepts. Read from $DEEPSEEK_API_KEY so the secret never lands in this file
# (or in checkpoints / event logs).
#
# Note: the `claude` provider only honors `base_url` + `api_key` (and an
# optional `type`, which must be `anthropic`). `bearer_token`, `wire_api`,
# `headers`, and `azure` are copilot-only and rejected here.
provider:
  name: claude
  type: anthropic
  base_url: https://api.deepseek.com/anthropic
  api_key: ${DEEPSEEK_API_KEY:-your-api-key-here}
default_model: deepseek-v4-pro
