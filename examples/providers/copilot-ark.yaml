# Volcengine Ark provider profile (DeepSeek served via Ark).
#
# Pass to any workflow with:  -p examples/providers/copilot-ark.yaml
#
# Ark authenticates with `Authorization: Bearer <key>` and rejects `x-api-key`
# with HTTP 401. The api_key (read from $VOLCES_ARK_API_KEY) is configured the
# same way as every other profile; the copilot provider detects the Ark
# anthropic endpoint and automatically forwards it as a Bearer token instead of
# x-api-key. No special handling needed in this file.
#
# The Agent Plan anthropic-compatible endpoint lives under /api/plan (the client
# appends /v1/messages). The OpenAI-compatible equivalent is /api/plan/v3.
provider:
  name: copilot
  type: anthropic
  base_url: https://ark.cn-beijing.volces.com/api/plan
  api_key: ${VOLCES_ARK_API_KEY:-your-api-key-here}
default_model: deepseek-v4-pro
