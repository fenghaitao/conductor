# Mission Planning — Understand Phase
#
# Iterative Q&A + codebase investigation. Produces a planning_summary
# consumed by 1-propose.yaml, and writes missions/<name>/exploration.md.
#
# Steps:
#   0. check_existing     — skip if mission.md already written (idempotent)
#   1. inspect_codebase   — script: directory listing, README, package files
#   2. clarify            — LLM asks user clarifying questions about requirements,
#                           infrastructure, tech choices, validation approach
#  2b. clarify_answers    — human gate: user answers (empty under --skip-gates)
#   3. investigate        — LLM deep-dives into the codebase, anchored on the
#                           mission idea, and emits the planning_summary as Markdown
#   4. write_explore      — script: sanitises + writes missions/<name>/exploration.md

workflow:
  name: mission-explore
  description: Understand requirements and codebase before proposing
  version: "1.0.0"
  entry_point: check_existing

  runtime:
    provider:
      name: copilot
      base_url: https://api.deepseek.com/anthropic
      api_key: ${DEEPSEEK_API_KEY}
      type: anthropic
    default_model: deepseek-v4-pro

  input:
    mission_name:
      type: string
      required: true
    working_directory:
      type: string
      required: false
      description: Absolute path to the repository (defaults to current directory)
    idea:
      type: string
      required: false

  context:
    mode: accumulate

  limits:
    max_iterations: 60

agents:
  # ── Step 0 ──────────────────────────────────────────────────────────────────
  - name: check_existing
    type: script
    description: Skip if mission.md already exists (idempotent).
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, sys

        mission_name = sys.argv[1]
        wd_input = sys.argv[2].strip() if len(sys.argv) > 2 and sys.argv[2].strip() else str(pathlib.Path.cwd())
        mission_dir = pathlib.Path("missions") / mission_name
        mission_md = mission_dir / "mission.md"

        if mission_md.exists():
            print(json.dumps({
                "state": "done",
                "working_directory": (mission_dir / "working_directory.txt").read_text().strip()
                    if (mission_dir / "working_directory.txt").exists() else wd_input,
            }))
        else:
            print(json.dumps({"state": "ready", "working_directory": wd_input}))
      - "{{ workflow.input.mission_name }}"
      - "{{ workflow.input.working_directory | default('') }}"
    output:
      state:             { type: string }
      working_directory: { type: string }
    routes:
      - to: $end
        when: "state == 'done'"
      - to: inspect_codebase

  # ── Step 1 ──────────────────────────────────────────────────────────────────
  - name: inspect_codebase
    type: script
    description: |
      Gather structural overview of the working directory so the LLM has
      baseline context before asking clarifying questions.
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, subprocess, sys

        wd = pathlib.Path(sys.argv[1]) if sys.argv[1] else pathlib.Path.cwd()

        def read(p):
            try: return p.read_text(errors="replace")[:3000]
            except: return ""

        # Directory tree (2 levels, skip hidden/.venv/node_modules)
        def tree(d, depth=0, max_depth=2):
            if depth > max_depth: return []
            lines = []
            try:
                entries = sorted(d.iterdir(), key=lambda x: (x.is_file(), x.name))
            except: return []
            for e in entries:
                if e.name.startswith(".") or e.name in ("node_modules", ".venv", "__pycache__", "dist", "build"):
                    continue
                prefix = "  " * depth
                if e.is_dir():
                    lines.append(f"{prefix}{e.name}/")
                    lines.extend(tree(e, depth+1, max_depth))
                else:
                    lines.append(f"{prefix}{e.name}")
            return lines

        structure = "\n".join(tree(wd)) if wd.exists() else "(directory not found)"

        # Key files
        readme = read(wd / "README.md") or read(wd / "readme.md") or ""
        pkg = read(wd / "package.json") or read(wd / "pyproject.toml") or ""
        agents_md = read(wd / "AGENTS.md") or ""

        # Running processes on common ports
        try:
            ports = subprocess.check_output(
                ["bash", "-c", "lsof -i -P -n 2>/dev/null | grep LISTEN | head -30"],
                text=True, timeout=5
            )
        except:
            ports = "(could not check)"

        print(json.dumps({
            "structure": structure,
            "readme": readme,
            "package_file": pkg,
            "agents_md": agents_md,
            "listening_ports": ports,
            "working_directory": str(wd),
        }))
      - "{{ workflow.input.working_directory }}"
    output:
      structure:        { type: string }
      readme:           { type: string }
      package_file:     { type: string }
      agents_md:        { type: string }
      listening_ports:  { type: string }
      working_directory: { type: string }
    routes:
      - to: clarify

  # ── Step 2 ──────────────────────────────────────────────────────────────────
  - name: clarify
    model: deepseek-v4-pro
    description: |
      Ask the user clarifying questions to fully understand requirements,
      tech choices, infrastructure constraints, and validation approach.
      Iterates until all important unknowns are resolved.
    prompt: |
      You are the architect of a multi-agent software mission. Your job is to
      deeply understand what needs to be built before proposing anything.

      MISSION NAME: {{ workflow.input.mission_name }}
      WORKING DIRECTORY: {{ inspect_codebase.output.working_directory }}

      {% if workflow.input.idea %}
      INITIAL IDEA: {{ workflow.input.idea }}
      {% endif %}

      CODEBASE STRUCTURE:
      {{ inspect_codebase.output.structure }}

      {% if inspect_codebase.output.readme %}
      README:
      {{ inspect_codebase.output.readme }}
      {% endif %}

      {% if inspect_codebase.output.package_file %}
      PACKAGE FILE:
      {{ inspect_codebase.output.package_file }}
      {% endif %}

      {% if inspect_codebase.output.listening_ports %}
      CURRENTLY LISTENING PORTS:
      {{ inspect_codebase.output.listening_ports }}
      {% endif %}

      ---

      Ask the user ALL questions needed to understand:
      1. What exactly needs to be built (features, user flows, edge cases)
      2. Technology and framework requirements (explicit package/library choices are binding)
      3. Infrastructure needs (services, databases, APIs, ports)
      4. External dependencies (APIs, auth providers, third-party SDKs)
      5. Testing surfaces (web UI, CLI, API) and validation approach
      6. Any constraints, performance requirements, or security requirements

      Ask everything in one go — be thorough. The user's answers become the
      foundation of the validation contract and feature decomposition.

      CRITICAL: If the user explicitly names a package, library, SDK, or tool,
      treat it as a binding requirement — never substitute an alternative later.
    output:
      questions:
        type: string
        description: All clarifying questions the user needs to answer
    routes:
      - to: clarify_answers

  # ── Step 2b ─────────────────────────────────────────────────────────────────
  - name: clarify_answers
    type: human_gate
    description: Collect the user's answers to the clarifying questions
    prompt: |
      ## Clarifying Questions

      {{ clarify.output.questions }}

      Please provide detailed answers to all the questions above.
      Your answers become the foundation of the validation contract
      and feature decomposition.
    options:
      - label: "Submit answers"
        value: submitted
        route: investigate
        prompt_for: response

  # ── Step 3 ──────────────────────────────────────────────────────────────────
  - name: investigate
    model: deepseek-v4-pro
    description: |
      Deep-dive into the codebase and research technologies as needed.
      Uses available tools to read files, trace code, check ports.
      Produces a thorough understanding of the implementation landscape.
    tools: null
    prompt: |
      You are planning EXACTLY this mission — stay anchored to it. Do not
      substitute a different feature you find interesting while exploring.

      MISSION IDEA (authoritative — everything below must serve this):
      {{ workflow.input.idea | default('(no idea provided)') }}

      You now have the user's answers from the clarification above.

      USER ANSWERS:
      {{ clarify_answers.output.additional_input.response if clarify_answers.output.additional_input.response is defined else '(Running autonomously with no manual answers — rely on the MISSION IDEA above and your own codebase investigation.)' }}

      Investigate the codebase and any technologies as needed to answer:
      - Where does complexity concentrate?
      - What existing code is relevant and must be respected?
      - What infrastructure is already running vs. needs to be set up?
      - What testing surfaces exist and how can they be exercised?
      - Are there technology/SDK choices where you need to verify correct patterns?

      Working directory: {{ inspect_codebase.output.working_directory }}

      Use your tools to read files, check running services, research technologies.
      Investigate until nothing important is ambiguous.

      After investigation, output a comprehensive planning summary with exactly
      these sections, each as a level-2 Markdown heading:

      ## What we're building
      Precise feature list with user flows.

      ## Technology decisions
      Explicit package/tool choices (binding).

      ## Architecture approach
      How the system is structured.

      ## Infrastructure
      Services needed, ports, external APIs.

      ## Milestones
      Logical groupings of features in build order.

      ## Worker types
      Distinct skill domains (e.g. backend-worker, frontend-worker).

      ## Testing surfaces
      How each area will be validated.

      ## Open risks
      Anything that needs special attention.

      OUTPUT FORMAT (strict): the `planning_summary` field MUST contain only
      clean GitHub-flavored Markdown — the `##` sections above with real line
      breaks. Do NOT wrap it in YAML or JSON, do NOT emit `type:` or
      `description:` keys, do NOT add code fences around the whole document, and
      do NOT escape newlines as the literal characters backslash-n. Start the
      value directly with `## What we're building`.
    output:
      planning_summary:
        type: string
        description: |
          The planning summary as raw GitHub-flavored Markdown (## headings,
          real newlines). No YAML/JSON envelope, no escaped newlines.
    routes:
      - to: write_explore

  # ── Step 4 ──────────────────────────────────────────────────────────────────
  - name: write_explore
    type: script
    description: |
      Persist the planning summary to missions/<name>/exploration.md as the
      explore-phase artifact (created before the missionDir exists). Sanitises
      any stray output-schema envelope or escaped newlines so the file is always
      clean Markdown, regardless of model quirks.
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, re, sys

        mission_name = sys.argv[1]
        raw = sys.argv[2]

        def clean(text):
            text = text.strip()
            # Strip code fences wrapping the whole document.
            fence = re.match(r"^```(?:markdown|md)?\s*\n(.*?)\n```$", text, re.S)
            if fence:
                text = fence.group(1).strip()
            # Strip a stray "type: ...\ndescription: <value>" output-schema
            # envelope some models echo; keep only the description value.
            if text.lstrip().lower().startswith(("type:", "description:")):
                m = re.search(r"(?:^|\n)description:[ \t]*(.*)$", text, re.S)
                if m:
                    val = m.group(1).strip()
                    if len(val) >= 2 and val[0] in "\"'" and val[-1] == val[0]:
                        val = val[1:-1]
                    text = val
            # Unescape literal escape sequences if the model emitted them.
            if "\\n" in text:
                text = text.replace("\\r\\n", "\n").replace("\\n", "\n")
            text = text.replace('\\"', '"').replace("\\t", "\t")
            return text.strip()

        summary = clean(raw)
        mission_dir = pathlib.Path("missions") / mission_name
        mission_dir.mkdir(parents=True, exist_ok=True)
        out = mission_dir / "exploration.md"
        out.write_text(f"# Exploration: {mission_name}\n\n{summary}\n")
        print(json.dumps({"exploration_path": str(out)}))
      - "{{ workflow.input.mission_name }}"
      - "{{ investigate.output.planning_summary }}"
    output:
      exploration_path: { type: string }
    routes:
      - to: $end

output:
  planning_summary: "{{ investigate.output.planning_summary if investigate is defined else '' }}"
  working_directory: "{{ check_existing.output.working_directory if check_existing is defined else inspect_codebase.output.working_directory }}"
  exploration_path: "{{ write_explore.output.exploration_path if write_explore is defined else '' }}"
