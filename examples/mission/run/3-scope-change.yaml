# Scope Change Phase
#
# Handles mid-mission scope and guidance changes from the user.
# Called from run.yaml when a user wants to modify the mission mid-run.
#
# Supports two change types:
#   - Scope change: add/remove features, modify expected behaviors
#     → updates mission.md, validation-contract.md, validation-state.yaml, features.yaml
#   - Guidance change: update conventions, tech choices, constraints
#     → updates mission.md, AGENTS.md (and skill files if needed)
#   - Both: handles mixed changes in one pass
#
# All changes are written atomically and logged to change-log/<timestamp>.yaml.
#
# Steps:
#   1. collect_change      — human gate: describe what to change
#   2. load_artifacts      — script: read all current mission artifacts
#   3. analyze_and_apply   — LLM (reasoning: high): produce updated artifact content
#   4. save_changes        — script: write updated files + log entry
#   5. confirm_changes     — human gate: review summary, confirm or re-describe

workflow:
  name: mission-scope-change
  description: Apply mid-mission scope or guidance changes and propagate to all artifacts
  version: "1.0.0"
  entry_point: collect_change

  runtime:
    provider:
      name: copilot
      base_url: https://api.deepseek.com/anthropic
      api_key: ${DEEPSEEK_API_KEY}
      type: anthropic
    temperature: 0.7
    default_model: deepseek-v4-pro

  input:
    mission_dir:
      type: string
      required: true

  context:
    mode: accumulate

  limits:
    max_iterations: 30

agents:
  # ── Step 1 ──────────────────────────────────────────────────────────────────
  - name: collect_change
    type: human_gate
    description: Collect the change description from the user.
    prompt: |
      ## Mid-Mission Change Request

      Describe what you want to change. Be as specific as possible:

      **For scope changes** (what is built):
      - What features should be added, modified, or removed?
      - Which milestones are affected?
      - Are new validation assertions needed?
      - Example: "Add rate limiting to all API endpoints — max 100 req/min per user"

      **For guidance changes** (how workers build it):
      - What convention, tool choice, or constraint is changing?
      - Example: "Switch from dataclasses to Pydantic models for all data types"
      - Example: "All database calls must go through the repository layer — no direct ORM queries in routes"

      You can describe multiple changes at once. The orchestrator will propagate
      them consistently across mission.md, AGENTS.md, validation-contract.md,
      features.yaml, and validation-state.yaml as needed.
    options:
      - label: "Submit change description"
        value: submitted
        route: load_artifacts
        prompt_for: response

  # ── Step 2 ──────────────────────────────────────────────────────────────────
  - name: load_artifacts
    type: script
    description: Read all current mission artifacts for context.
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, sys
        from ruamel.yaml import YAML

        mission_dir = pathlib.Path(sys.argv[1])
        def read(p): return p.read_text() if p.exists() else ""
        yaml = YAML()

        features_data = {}
        fp = mission_dir / "features.yaml"
        if fp.exists():
            features_data = yaml.load(fp.read_text()) or {}

        # Summarize change log if it exists
        change_log = []
        cl_dir = mission_dir / "change-log"
        if cl_dir.exists():
            for cf in sorted(cl_dir.glob("*.yaml"))[-3:]:  # last 3 changes
                try:
                    entry = yaml.load(cf.read_text())
                    change_log.append(f"[{entry.get('timestamp','')}] {entry.get('change_summary','')}")
                except Exception:
                    pass

        print(json.dumps({
            "mission_md":       read(mission_dir / "mission.md"),
            "agents_md":        read(mission_dir / "AGENTS.md"),
            "contract_md":      read(mission_dir / "validation-contract.md"),
            "features_yaml":    read(mission_dir / "features.yaml"),
            "state_yaml":       read(mission_dir / "validation-state.yaml"),
            "architecture_md":  read(mission_dir / "architecture.md"),
            "feature_count":    len(features_data.get("features", [])),
            "recent_changes":   "\n".join(change_log) if change_log else "(none)",
        }))
      - "{{ workflow.input.mission_dir }}"
    output:
      mission_md:      { type: string }
      agents_md:       { type: string }
      contract_md:     { type: string }
      features_yaml:   { type: string }
      state_yaml:      { type: string }
      architecture_md: { type: string }
      feature_count:   { type: number }
      recent_changes:  { type: string }
    routes:
      - to: analyze_and_apply

  # ── Step 3 ──────────────────────────────────────────────────────────────────
  - name: analyze_and_apply
    model: claude-sonnet-4.6
    reasoning:
      effort: high
    description: |
      Analyze the requested change and produce COMPLETE updated content for
      every affected artifact. Propagates consistently across all artifacts.
    prompt: |
      You are the mission orchestrator applying a mid-mission change request.

      REQUESTED CHANGE (from user):
      {{ collect_change.output.response }}

      RECENT CHANGE HISTORY:
      {{ load_artifacts.output.recent_changes }}

      ═════════════════════════════════════════════════
      CURRENT MISSION ARTIFACTS
      ═════════════════════════════════════════════════

      MISSION.MD:
      {{ load_artifacts.output.mission_md }}

      ARCHITECTURE.MD:
      {{ load_artifacts.output.architecture_md }}

      AGENTS.MD:
      {{ load_artifacts.output.agents_md }}

      VALIDATION CONTRACT:
      {{ load_artifacts.output.contract_md }}

      FEATURES.YAML:
      {{ load_artifacts.output.features_yaml }}

      VALIDATION STATE:
      {{ load_artifacts.output.state_yaml }}

      ═════════════════════════════════════════════════
      INSTRUCTIONS
      ═════════════════════════════════════════════════

      Classify the change:
      - SCOPE: modifies what is built (features, behaviors, requirements)
      - GUIDANCE: modifies how workers build it (conventions, tools, constraints)
      - BOTH: affects both dimensions

      Produce COMPLETE updated content for EVERY artifact that needs to change.
      Do not produce partial updates — each artifact must be complete and self-consistent.

      === SCOPE CHANGES must update consistently: ===
      1. mission.md — update requirements/milestones section
      2. validation-contract.md — add new VAL-* assertions (following existing ID sequence)
         or mark removed assertions as "REMOVED: <reason>" inline
      3. validation-state.yaml — add new IDs as "pending", remove deleted IDs
      4. features.yaml — add new features for new scope, update descriptions for modified
         scope; NEVER delete completed features (they are sealed history)

      === GUIDANCE CHANGES must update consistently: ===
      1. mission.md — update constraints/conventions section
      2. AGENTS.md — update binding technology choices or worker rules
         (changes take effect immediately for all PENDING workers)
         Note: "## Known Pre-Existing Issues" section must be preserved unchanged.

      === COVERAGE INVARIANT ===
      After any scope change, every VAL-* ID in the contract must be claimed by
      exactly one feature in features.yaml. Add features if new IDs were added.

      Output YAML (include ONLY artifacts that actually change — use "UNCHANGED" for others):
      ```yaml
      change_type: scope | guidance | both
      change_summary: "<2-3 sentence summary of what is changing and why>"
      updates:
        mission_md: |
          <complete updated mission.md content, or UNCHANGED>
        agents_md: |
          <complete updated AGENTS.md content, or UNCHANGED>
        contract_md: |
          <complete updated validation-contract.md content, or UNCHANGED>
        features_yaml: |
          <complete updated features.yaml content, or UNCHANGED>
        validation_state_yaml: |
          <complete updated validation-state.yaml content, or UNCHANGED>
      ```
    output:
      updates_yaml:
        type: string
    routes:
      - to: save_changes

  # ── Step 4 ──────────────────────────────────────────────────────────────────
  - name: save_changes
    type: script
    description: Write updated artifact files and log the change.
    command: python3
    args:
      - "-c"
      - |
        import datetime, json, pathlib, sys
        from ruamel.yaml import YAML

        mission_dir = pathlib.Path(sys.argv[1])
        updates_yaml = sys.argv[2]

        yaml = YAML()
        yaml.preserve_quotes = True

        try:
            data = yaml.load(updates_yaml)
        except Exception as e:
            print(json.dumps({"saved": [], "error": str(e), "change_summary": "parse error"}))
            sys.exit(0)

        updates = data.get("updates", {})
        change_summary = data.get("change_summary", "")

        artifact_map = {
            "mission_md":            mission_dir / "mission.md",
            "agents_md":             mission_dir / "AGENTS.md",
            "contract_md":           mission_dir / "validation-contract.md",
            "features_yaml":         mission_dir / "features.yaml",
            "validation_state_yaml": mission_dir / "validation-state.yaml",
        }

        saved = []
        for key, path in artifact_map.items():
            content = updates.get(key, "UNCHANGED")
            if isinstance(content, str) and content.strip() not in ("UNCHANGED", ""):
                path.write_text(content)
                saved.append(path.name)

        # Archive the change
        changes_dir = mission_dir / "change-log"
        changes_dir.mkdir(exist_ok=True)
        ts = datetime.datetime.now().strftime("%Y%m%d-%H%M%S")
        log_entry = {
            "timestamp": ts,
            "change_type": data.get("change_type", "unknown"),
            "change_summary": change_summary,
            "artifacts_updated": saved,
        }
        log_path = changes_dir / f"{ts}.yaml"
        with open(log_path, "w") as f:
            yaml.dump(log_entry, f)

        print(json.dumps({
            "saved": saved,
            "change_summary": change_summary,
            "change_log_path": str(log_path),
        }))
      - "{{ workflow.input.mission_dir }}"
      - "{{ analyze_and_apply.output.updates_yaml }}"
    output:
      saved:            { type: array }
      change_summary:   { type: string }
      change_log_path:  { type: string }
    routes:
      - to: confirm_changes

  # ── Step 5 ──────────────────────────────────────────────────────────────────
  - name: confirm_changes
    type: human_gate
    description: Show the user a summary of what was changed before resuming.
    prompt: |
      ## Changes Applied

      {{ save_changes.output.change_summary }}

      **Updated artifacts:**
      {% for f in save_changes.output.saved %}
      - {{ f }}
      {% endfor %}

      Change log: {{ save_changes.output.change_log_path }}

      The mission will resume from the next pending milestone.
      All pending workers will receive the updated guidance.

      If the changes look wrong, select **Re-describe** to make corrections.
      Changes are already written — if you re-describe, the new request will
      layer on top (e.g. "Undo the previous change and instead do X").
    options:
      - label: "Continue — changes look correct"
        value: continue
        route: $end
      - label: "Re-describe — I need to adjust the change"
        value: redescribe
        route: collect_change

output:
  change_summary:  "{{ save_changes.output.change_summary | default('No changes applied') }}"
  saved_artifacts: "{{ save_changes.output.saved | default([]) }}"
