# Mission Run Pipeline
#
# Executes all pending features from features.yaml, milestone by milestone.
# After each milestone: auto-runs scrutiny (lint/tests/code-review) then
# user-testing (end-to-end behavioral assertions).
#
# Can be run standalone after plan.yaml completes, or resumed
# after interruption via `conductor resume`.
#
# Usage:
#   conductor run examples/mission/run.yaml \
#     --input mission_dir="/path/to/missions/my-app"
#
# Resume:
#   conductor resume examples/mission/run.yaml
#
# The loop:
#   get_milestone → feature_runner (for_each sequential)
#     → run_scrutiny → [scrutiny_passed?] → run_user_testing
#     → [testing_passed?] → seal_milestone → prompt_for_changes
#     → [changes?] → apply_scope_changes → get_milestone (loop)
#     → all done → collect_skill_feedback → orchestrator_review → [human gate if issues] → $end
#
# Gap fixes applied:
#   Gap 1+3: prompt_for_changes gate + apply_scope_changes sub-workflow
#   Gap 6:   collect_skill_feedback loop (skills improve after each milestone)
#   Gap 20:  seal_milestone script writes sealed.yaml marker per milestone

workflow:
  name: mission-run
  description: |
    Execute all pending features in features.yaml, validate each milestone,
    and loop until all milestones are complete.
  version: "1.0.0"
  entry_point: get_milestone

  runtime:
    provider: copilot
    default_model: claude-sonnet-4.6

  input:
    mission_dir:
      type: string
      required: true
      description: Absolute path to the missionDir (output from plan.yaml)

  limits:
    max_iterations: 500   # generous — large missions have many features

for_each:
  # ── Feature runner (sequential for_each) ──────────────────────────────────
  - name: feature_runner
    type: for_each
    description: |
      Implement each pending feature in this milestone, one at a time.
      Sequential (max_concurrent: 1) — features may touch the same files.
      Each feature is a run-feature.yaml sub-workflow with its own checkpoint.
    source: get_milestone.output.pending_features
    as: feature
    max_concurrent: 1
    failure_mode: continue_on_error

    agent:
      name: run_one_feature
      type: workflow
      workflow: ./run/feature.yaml
      input_mapping:
        mission_dir:         "{{ workflow.input.mission_dir }}"
        feature_id:          "{{ feature.id }}"
        feature_description: "{{ feature.description }}"
        skill_name:          "{{ feature.skill_name }}"
        expected_behavior:   "{{ feature.expected_behavior }}"
        fulfills:            "{{ feature.fulfills | join(', ') }}"
        milestone:           "{{ feature.milestone }}"

    routes:
      - to: run_scrutiny

agents:
  # ── Get next pending milestone ────────────────────────────────────────────
  - name: get_milestone
    type: script
    description: |
      Find the next milestone that has pending features.
      Returns the milestone name, its pending features, and overall state.
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, sys
        from ruamel.yaml import YAML

        mission_dir = pathlib.Path(sys.argv[1])
        yaml = YAML()
        data = yaml.load((mission_dir / "features.yaml").read_text())
        features = data.get("features", [])

        # Find first milestone with any pending features
        seen_milestones = []
        milestone_pending = {}
        for f in features:
            ms = f.get("milestone", "default")
            if ms not in seen_milestones:
                seen_milestones.append(ms)
            if f.get("status") == "pending":
                milestone_pending.setdefault(ms, []).append(f)

        # Features a worker handed back for an orchestrator decision.
        returned = [f for f in features if f.get("status") == "returned"]

        # Pick first milestone (in order) with pending features
        current_milestone = None
        for ms in seen_milestones:
            if ms in milestone_pending:
                current_milestone = ms
                break

        # Priority: pending work first; then resolve returned features via
        # orchestrator review; only then is the mission truly done. Without
        # the "returned" branch a worker that returned a feature would let
        # the mission reach all_done with that feature silently unaddressed.
        if current_milestone:
            state = "ready"
        elif returned:
            state = "returned"
        else:
            state = "all_done"

        print(json.dumps({
            "state": state,
            "milestone": current_milestone or "",
            "pending_features": milestone_pending.get(current_milestone, []),
            "total_features": len(features),
            "completed_features": sum(1 for f in features if f.get("status") == "completed"),
            "returned_features": [f.get("id") for f in returned],
        }))
      - "{{ workflow.input.mission_dir }}"
    output:
      state:              { type: string }
      milestone:          { type: string }
      pending_features:   { type: array }
      total_features:     { type: number }
      completed_features: { type: number }
      returned_features:  { type: array }
    routes:
      - to: orchestrator_review_returned
        when: "state == 'returned'"
      - to: collect_skill_feedback
        when: "state == 'all_done'"
      - to: feature_runner

  # ── Collect skill feedback (all milestones done) ─────────────────────────
  - name: collect_skill_feedback
    type: script
    description: |
      After all milestones complete, scan handoffs for skill deviation feedback
      and apply suggested improvements to each skills/<type>/SKILL.md.
      Workers report skill deviations in the handoff's skill_feedback field.
      This closes the skill improvement loop.
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, sys
        from ruamel.yaml import YAML

        mission_dir = pathlib.Path(sys.argv[1])
        yaml = YAML()
        yaml.preserve_quotes = True

        # Collect all skill feedback from handoffs
        skill_feedback = {}  # skill_name -> list of feedback entries
        handoffs_dir = mission_dir / "handoffs"
        if handoffs_dir.exists():
            for hf in sorted(handoffs_dir.glob("*.yaml")):
                try:
                    data = yaml.load(hf.read_text())
                    fb = data.get("skill_feedback", [])
                    if not fb:
                        continue
                    skill_name = data.get("skill_name", "")
                    if not skill_name:
                        # Try to recover from features.yaml
                        fid = data.get("feature_id", "")
                        features_path = mission_dir / "features.yaml"
                        if features_path.exists():
                            fd = yaml.load(features_path.read_text())
                            for f in fd.get("features", []):
                                if str(f.get("id", "")) == str(fid):
                                    skill_name = f.get("skill_name", "")
                                    break
                    if skill_name:
                        skill_feedback.setdefault(skill_name, []).extend(fb)
                except Exception:
                    pass

        # Append feedback to each skill's SKILL.md
        updated = []
        skills_dir = mission_dir / "skills"
        for skill_name, feedbacks in skill_feedback.items():
            skill_path = skills_dir / skill_name / "SKILL.md"
            if not skill_path.exists():
                continue
            current = skill_path.read_text()
            # Append a feedback section if not already present
            feedback_section = "\n\n## Accumulated Worker Feedback\n\n"
            feedback_section += "These deviations were reported by workers during the mission.\n"
            feedback_section += "Review and incorporate into the procedure above as appropriate.\n\n"
            for fb in feedbacks:
                step = fb.get("step", "unknown")
                did = fb.get("what_i_did_instead", "")
                why = fb.get("why", "")
                feedback_section += f"- Step `{step}`: {did}"
                if why:
                    feedback_section += f" (reason: {why})"
                feedback_section += "\n"
            # Only append if there is new content
            marker = "## Accumulated Worker Feedback"
            if marker not in current:
                skill_path.write_text(current + feedback_section)
            else:
                # Append to existing section
                skill_path.write_text(current + "\n" + "\n".join(
                    f"- Step `{fb.get('step','?')}`: {fb.get('what_i_did_instead','')}"
                    for fb in feedbacks
                ))
            updated.append(skill_name)

        print(json.dumps({
            "skills_updated": updated,
            "feedback_count": sum(len(v) for v in skill_feedback.values()),
        }))
      - "{{ workflow.input.mission_dir }}"
    output:
      skills_updated: { type: array }
      feedback_count: { type: number }
    routes:
      - to: orchestrator_review

  # ── Orchestrator review (all milestones complete) ─────────────────────────
  - name: orchestrator_review
    type: workflow
    description: |
      Review all worker handoff issues (return_to_orchestrator: true) and
      any knowledge surfaced during the mission. Applies guidance updates
      and optionally escalates unresolved issues to the user.
    workflow: ./run/orchestrator-review.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
    routes:
      - to: $end

  # ── Orchestrator review (mid-mission, returned features) ───────────────────
  - name: orchestrator_review_returned
    type: workflow
    description: |
      Resolve features a worker handed back (return_to_orchestrator → status
      "returned") before the mission can complete. The review resets them to
      pending with updated guidance, accepts them, or escalates to the user;
      every returned feature leaves "returned" status so this never loops.
      Routes back to get_milestone so resolved features re-enter the run.
    workflow: ./run/orchestrator-review.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
    routes:
      - to: get_milestone

  # ── Scrutiny phase ────────────────────────────────────────────────────────
  - name: run_scrutiny
    type: workflow
    description: |
      Run programmatic validators (test, typecheck, lint) and spawn per-feature
      code review subagents for the completed milestone. Fails → features reset
      to pending and feature_runner re-runs them.
    workflow: ./run/scrutiny.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
      milestone:   "{{ get_milestone.output.milestone }}"
    routes:
      - to: run_user_testing
        when: "scrutiny_passed == True"
      - to: get_milestone
        when: "scrutiny_passed == False"

  # ── User testing phase ─────────────────────────────────────────────────────
  - name: run_user_testing
    type: workflow
    description: |
      Test all pending VAL-* assertions for this milestone through real user surfaces.
      Updates validation-state.yaml with pass/fail results.
      Fails → fix features injected, loops back to feature_runner via get_milestone.
      Passes → seal_milestone, then prompt for mid-mission changes.
    workflow: ./run/user-testing.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
      milestone:   "{{ get_milestone.output.milestone }}"
    routes:
      - to: seal_milestone
        when: "testing_passed == True"
      - to: get_milestone
        when: "testing_passed == False"

  # ── Seal milestone ─────────────────────────────────────────────────────────
  - name: seal_milestone
    type: script
    description: |
      Write validation/<milestone>/sealed.yaml to mark this milestone as sealed.
      Once sealed, future scope changes target new milestones rather than reopening this one.

    command: python3
    args:
      - "-c"
      - |
        import datetime, json, pathlib, sys
        from ruamel.yaml import YAML

        mission_dir = pathlib.Path(sys.argv[1])
        milestone = sys.argv[2]
        yaml = YAML()
        yaml.preserve_quotes = True

        seal_dir = mission_dir / "validation" / milestone
        seal_dir.mkdir(parents=True, exist_ok=True)
        seal_path = seal_dir / "sealed.yaml"

        # Count assertions that passed for this milestone
        state_path = mission_dir / "validation-state.yaml"
        state = yaml.load(state_path.read_text()) if state_path.exists() else {}

        # Get feature IDs in this milestone
        features_path = mission_dir / "features.yaml"
        features_data = yaml.load(features_path.read_text()) if features_path.exists() else {}
        milestone_features = [
            f for f in features_data.get("features", [])
            if f.get("milestone") == milestone and f.get("status") == "completed"
        ]
        milestone_val_ids = set()
        for f in milestone_features:
            for vid in f.get("fulfills", []):
                milestone_val_ids.add(vid)

        passed = sum(1 for vid in milestone_val_ids if state.get(vid) == "passed")

        seal_data = {
            "milestone": milestone,
            "sealed_at": datetime.datetime.now().isoformat(),
            "features_completed": len(milestone_features),
            "assertions_passed": passed,
            "assertions_total": len(milestone_val_ids),
        }
        with open(seal_path, "w") as f:
            yaml.dump(seal_data, f)

        print(json.dumps({
            "sealed": True,
            "seal_path": str(seal_path),
            "milestone": milestone,
        }))
      - "{{ workflow.input.mission_dir }}"
      - "{{ get_milestone.output.milestone }}"
    output:
      sealed:     { type: boolean }
      seal_path:  { type: string }
      milestone:  { type: string }
    routes:
      - to: prompt_for_changes

  # ── Prompt for mid-mission changes ────────────────────────────────────────────
  - name: prompt_for_changes
    type: human_gate
    description: |
      Optional mid-mission change gate at each milestone boundary.
      Gives the user a chance to update scope or guidance before the next milestone.

    prompt: |
      ## Milestone {{ seal_milestone.output.milestone }} Complete and Sealed

      The milestone has passed scrutiny and user-testing.
      Sealed at: {{ seal_milestone.output.seal_path }}

      Before the next milestone begins, you can:
      - **Make a scope change**: add/remove features or modify expected behavior
      - **Make a guidance change**: update conventions, tool choices, or constraints

      Selecting "Continue" resumes immediately with no changes.
      The mission loop will pick up the next pending milestone.
    options:
      - label: "Continue — no changes needed"
        value: continue
        route: get_milestone
      - label: "Make a scope or guidance change"
        value: change
        route: apply_scope_changes

  # ── Apply scope/guidance changes ──────────────────────────────────────────────
  - name: apply_scope_changes
    type: workflow
    description: |
      Propagate user-requested scope or guidance changes to mission.md, AGENTS.md,
      validation-contract.md, features.yaml, and validation-state.yaml.
    workflow: ./run/scope-change.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
    routes:
      - to: get_milestone

output:
  mission_dir:        "{{ workflow.input.mission_dir }}"
  total_features:     "{{ get_milestone.output.total_features }}"
  completed_features: "{{ get_milestone.output.completed_features }}"
  summary: |
    Mission run complete.
    missionDir: {{ workflow.input.mission_dir }}
