# Mission Run Pipeline
#
# Executes all pending features from features.yaml, milestone by milestone.
# Per milestone: implement → review (lint/tests/code-review) → verify (E2E assertions).
#
# Can be run standalone after plan.yaml completes, or resumed
# after interruption via `conductor resume`.
#
# Usage:
#   conductor run examples/mission/run.yaml \
#     --input mission_dir="/path/to/missions/my-app"
#
# Resume:
#   conductor resume examples/mission/run.yaml
#
# The loop:
#   get_milestone → implement_milestone → review_milestone
#     → [passed?] → verify_milestone → [passed?] → seal_milestone
#     → prompt_for_changes → [change?] → apply_changes → loop
#     → all done → collect_feedback → triage_issues → [human gate?] → $end
#
workflow:
  name: mission-run
  description: |
    Execute all pending features in features.yaml, validate each milestone,
    and loop until all milestones are complete.
  version: "1.0.0"
  entry_point: get_milestone

  runtime:
    provider:
      name: copilot
      base_url: https://api.deepseek.com/anthropic
      api_key: ${DEEPSEEK_API_KEY}
      type: anthropic
    default_model: deepseek-v4-pro

  input:
    mission_dir:
      type: string
      required: true
      description: Absolute path to the missionDir (output from plan.yaml)

  limits:
    max_iterations: 500   # generous — large missions have many features

agents:
  # ── Implement milestone (sequential feature runner) ───────────────────────
  - name: implement_milestone
    type: workflow
    description: |
      Implement all pending features in this milestone, one at a time.
      Each feature is a 0-implement-feature.yaml sub-workflow with its own checkpoint.
    workflow: ./run/milestone/0-implement.yaml
    input_mapping:
      mission_dir:        "{{ workflow.input.mission_dir }}"
      milestone:          "{{ get_milestone.output.milestone }}"
      pending_features:   "{{ get_milestone.output.pending_features }}"
    routes:
      - to: review_milestone

  # ── Get next pending milestone ────────────────────────────────────────────
  - name: get_milestone
    type: script
    description: |
      Find the next milestone that has pending features.
      Returns the milestone name, its pending features, and overall state.
    command: python3
    args:
      - "-c"
      - |
        import json, pathlib, sys
        from ruamel.yaml import YAML

        mission_dir = pathlib.Path(sys.argv[1])
        yaml = YAML()
        data = yaml.load((mission_dir / "features.yaml").read_text())
        features = data.get("features", [])

        # Find first milestone with any pending features
        seen_milestones = []
        milestone_pending = {}
        for f in features:
            ms = f.get("milestone", "default")
            if ms not in seen_milestones:
                seen_milestones.append(ms)
            if f.get("status") == "pending":
                milestone_pending.setdefault(ms, []).append(f)

        # Features a worker handed back for an orchestrator decision.
        returned = [f for f in features if f.get("status") == "returned"]

        # Pick first milestone (in order) with pending features
        current_milestone = None
        for ms in seen_milestones:
            if ms in milestone_pending:
                current_milestone = ms
                break

        # Priority: pending work first; then resolve returned features via
        # triage review; only then is the mission truly done. Without
        # the "returned" branch a worker that returned a feature would let
        # the mission reach all_done with that feature silently unaddressed.
        if current_milestone:
            state = "ready"
        elif returned:
            state = "returned"
        else:
            state = "all_done"

        print(json.dumps({
            "state": state,
            "milestone": current_milestone or "",
            "pending_features": milestone_pending.get(current_milestone, []),
            "total_features": len(features),
            "completed_features": sum(1 for f in features if f.get("status") == "completed"),
            "returned_features": [f.get("id") for f in returned],
        }))
      - "{{ workflow.input.mission_dir }}"
    output:
      state:              { type: string }
      milestone:          { type: string }
      pending_features:   { type: array }
      total_features:     { type: number }
      completed_features: { type: number }
      returned_features:  { type: array }
    routes:
      - to: wrap_up_returned
        when: "state == 'returned'"
      - to: collect_skill_feedback
        when: "state == 'all_done'"
      - to: implement_milestone

  # ── Collect skill feedback (all milestones done) ─────────────────────────
  - name: collect_skill_feedback
    type: workflow
    description: |
      Scan all worker handoffs for skill deviation feedback and apply
      improvements to skills/<type>/SKILL.md.
    workflow: ./run/collect-skill-feedback.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
    routes:
      - to: wrap_up

  # ── Orchestrator review (all milestones complete) ─────────────────────────
  - name: wrap_up
    type: workflow
    description: |
      Review all worker handoff issues (return_to_orchestrator: true) and
      any knowledge surfaced during the mission. Applies guidance updates
      and optionally escalates unresolved issues to the user.
    workflow: ./run/wrap-up.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
    routes:
      - to: $end

  # ── Orchestrator review (mid-mission, returned features) ───────────────────
  - name: wrap_up_returned
    type: workflow
    description: |
      Resolve features a worker handed back (return_to_orchestrator → status
      "returned") before the mission can complete. The review resets them to
      pending with updated guidance, accepts them, or escalates to the user;
      every returned feature leaves "returned" status so this never loops.
      Routes back to get_milestone so resolved features re-enter the run.
    workflow: ./run/wrap-up.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
    routes:
      - to: get_milestone

  # ── Review milestone ─────────────────────────────────────────────────────
  - name: review_milestone
    type: workflow
    description: |
      Run programmatic validators (test, typecheck, lint) and spawn per-feature
      code review subagents for the completed milestone. Fails → features reset
      to pending and feature_runner re-runs them.
    workflow: ./run/milestone/1-review.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
      milestone:   "{{ get_milestone.output.milestone }}"
    routes:
      - to: verify_milestone
        when: "scrutiny_passed == True"
      - to: get_milestone
        when: "scrutiny_passed == False"

  # ── Verify milestone ─────────────────────────────────────────────────────
  - name: verify_milestone
    type: workflow
    description: |
      Test all pending VAL-* assertions for this milestone through real user surfaces.
      Updates validation-state.yaml with pass/fail results.
      Fails → fix features injected, loops back to feature_runner via get_milestone.
      Passes → seal_milestone, then prompt for mid-mission changes.
    workflow: ./run/milestone/2-verify.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
      milestone:   "{{ get_milestone.output.milestone }}"
    routes:
      - to: seal_milestone
        when: "testing_passed == True"
      - to: get_milestone
        when: "testing_passed == False"

  # ── Seal milestone ─────────────────────────────────────────────────────────
  - name: seal_milestone
    type: workflow
    description: |
      Write validation/<milestone>/sealed.yaml to mark this milestone as sealed.
    workflow: ./run/milestone/3-seal.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
      milestone:   "{{ get_milestone.output.milestone }}"
    routes:
      - to: prompt_for_changes

  # ── Prompt for mid-mission changes ────────────────────────────────────────────
  - name: prompt_for_changes
    type: workflow
    description: |
      Ask the user if they want to make scope or guidance changes
      before the next milestone begins.
    workflow: ./run/change/0-prompt.yaml
    input_mapping:
      milestone: "{{ seal_milestone.output.milestone }}"
      seal_path: "{{ seal_milestone.output.seal_path }}"
    routes:
      - to: get_milestone
        when: "action == 'continue'"
      - to: apply_scope_changes
        when: "action == 'change'"

  # ── Apply scope/guidance changes ──────────────────────────────────────────────
  - name: apply_scope_changes
    type: workflow
    description: |
      Propagate user-requested scope or guidance changes to mission artifacts.
    workflow: ./run/change/1-apply.yaml
    input_mapping:
      mission_dir: "{{ workflow.input.mission_dir }}"
    routes:
      - to: get_milestone

output:
  mission_dir:        "{{ workflow.input.mission_dir }}"
  total_features:     "{{ get_milestone.output.total_features }}"
  completed_features: "{{ get_milestone.output.completed_features }}"
  summary: |
    Mission run complete.
    missionDir: {{ workflow.input.mission_dir }}
