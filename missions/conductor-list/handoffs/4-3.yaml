salient_summary: Feature 4.3 (workflow filter on `conductor list checkpoints`) 
  was already fully implemented by milestones 4.1 and 4.2 — no new code needed.
what_was_implemented: >
  The `[WORKFLOW]` positional argument on `conductor list checkpoints` was already
  implemented in `src/conductor/cli/list_cmd.py` as part of milestones 4.1 and 4.2.
  The `list_checkpoints` command (line 687) accepts `workflow: Path | None` via
  `typer.Argument`. The shared `_list_checkpoints_impl()` function (line 712)
  resolves the path to absolute, validates it exists (exits 1 with error on
  non-existent), passes the resolved path to
  `CheckpointManager.list_checkpoints(resolved_workflow)` for server-side filtering,
  and displays a specific empty-state message ("No checkpoints found for workflow:
  {name}") when filtering yields no results. Both Rich table and `--json` modes
  work correctly through the shared implementation. The deprecated `conductor
  checkpoints` alias also forwards the workflow argument via delegation to the
  shared impl (verified by `test_deprecated_with_workflow_filter`).

  Implementation location:
  - Command definition: `list_cmd.py` lines 687-709
  - Shared implementation: `list_cmd.py` lines 712-773
    * Path resolution + validation: lines 720-725
    * Filtered list_checkpoints call: line 727
    * Filtered empty-state message: lines 748-751
    * Unfiltered empty-state message: line 753
what_was_left_undone: ''
return_to_orchestrator: false
