salient_summary: Wrote 12 integration tests for VAL-CROSS-006 — template 
  discovery to workflow instantiation flow. Since `conductor init` was removed 
  during the registry redesign, instantiation is simulated by copying template 
  YAML files to temp directories. All 12 tests pass, and the full suite of 205 
  tests remains green.
what_was_implemented: >
  Added TestTemplateDiscoveryToWorkflowInstantiation class (12 test methods) to
  tests/test_cli/test_list.py covering the VAL-CROSS-006 flow.

  Template discovery tests (4):
  - test_templates_list_json_exits_zero — --json mode exits 0, returns valid array
  - test_templates_list_json_has_required_keys — every template has name/description/path
  - test_templates_list_paths_exist — every path field points to an existing YAML
  file
  - test_templates_list_shows_pipeline_fanout_loop — table mode shows all 3 built-in
  templates

  Workflow instantiation + discovery tests (5):
  - test_pipeline_template_discovery_after_instantiation — instantiated pipeline template
  discovered with 3 agents and pipeline topology
  - test_pipeline_template_discovery_json_metadata — JSON metadata confirms name,
  agent_count=3, has_pipeline=true
  - test_fan_out_template_discovery_after_instantiation — fan-out template discovered
  with for_each topology
  - test_loop_template_discovery_after_instantiation — loop template discovered with
  3 agents and pipeline topology
  - test_instantiated_workflow_excludes_non_workflow_files — heuristic filter excludes
  non-workflow YAML

  End-to-end flow tests (3):
  - test_full_flow_template_to_workflow_discovery — canonical VAL-CROSS-006 test
  - test_multiple_templates_instantiated_and_discovered — all 3 templates instantiated
  and verified simultaneously
  - test_all_commands_exit_zero_in_full_flow — every command in the flow exits 0

  Helper methods: _get_template_path() locates a template by name from list templates
  --json;
  _instantiate_template() copies a template YAML to an output directory (simulating
  the removed
  conductor init --template command).
what_was_left_undone: >
  The conductor init --template command does not exist in the current codebase
  (removed during registry redesign per docs/design/registry.md). The test simulates
  instantiation by copying template YAML files using shutil.copy2. If conductor init
  is reintroduced, the _instantiate_template helper should be updated to invoke
  conductor init --template <name> <dir> via CliRunner.
return_to_orchestrator: false
