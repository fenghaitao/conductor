  uv run pytest tests/test_cli/test_list.py -v\n      exit_code: 0\n      observation:
  All 208 tests passed\n    - command: uv run conductor list templates\n      exit_code:
  0\n      observation: Rich table showing 3 templates (Pipeline, Fan-out, Loop) with
  Name, Description, Path\n    - command: uv run conductor list templates --json\n\
