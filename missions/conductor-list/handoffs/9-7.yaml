  <temp-dir> (after copying pipeline.yaml)\n      exit_code: 0\n      observation:
  Table shows pipeline-template with 3 agents and pipeline topology\n    - command:
  uv run conductor list workflows --path <temp-dir> --json (all three templates)\n\
