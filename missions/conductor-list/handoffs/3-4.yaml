salient_summary: Implemented `--path` flag on `conductor list workflows` with 
  manual path validation for exit code 1 on nonexistent directories. Removed 
  Typer's `exists=True` to control the exit code and added Rich-styled error 
  messages.
what_was_implemented: >
  Modified `list_workflows()` in `src/conductor/cli/list_cmd.py` to support the `--path`
  flag with manual path validation. Removed Typer's `exists=True`, `dir_okay=True`,
  `file_okay=False` constraints from the `--path` Option decorator and added inline
  checks for path existence and directory type in the function body. Nonexistent
  paths print a `[bold red]Error:[/bold red]` message to stderr and raise `typer.Exit(code=1)`.
  Non-directory paths produce a similar error. Added the missing `console = Console(stderr=True)`
  module-level variable needed for error output. The `--path` flag combines correctly
  with
  `--recursive`, `--max-depth`, `--all`, and `--json`.
what_was_left_undone: ''
return_to_orchestrator: false
verification:
  commands_run:
  - command: uv run pytest tests/test_cli/test_list.py -v
    exit_code: 0
    observation: 92 tests passed — all 5 TestListWorkflowsPath tests pass, no 
      regressions
  - command: uv run ty check src/conductor/cli/list_cmd.py 
      src/conductor/cli/app.py
    exit_code: 0
    observation: All checks passed, no type errors
  - command: uv run ruff check src/conductor/cli/list_cmd.py 
