salient_summary: Feature 9.2 (VAL-CROSS-002) was already fully implemented by 
  prior work. The TestWorkflowDiscoveryToHistory class in 
  tests/test_cli/test_list.py contains 8 integration tests covering the full 
  workflow discovery → dry-run → recent history flow. All 205 tests in the file 
  pass, lint is clean, typecheck passes, and manual CLI verification confirms 
  correct behavior across all three phases.
what_was_implemented: >
  Feature 9.2 was already implemented in a prior worker's changeset. The integration
  test class `TestWorkflowDiscoveryToHistory` (lines 1638-1921 in tests/test_cli/test_list.py)
  provides 8 tests verifying the complete user journey:

  Phase 1 — Workflow discovery (3 tests):
  - test_discovery_shows_valid_workflow: `conductor list workflows` shows Name (from
    YAML metadata), Path, Agent count (2), Topology (pipeline)
  - test_discovery_json_has_correct_metadata: `--json` emits name, path, agent_count,
    has_parallel, has_for_each, has_pipeline
  - test_discovery_with_non_workflow_files_mixed: non-workflow YAML (docker-compose,
    config) excluded by heuristic filter

  Phase 2 — Dry-run execution (2 tests):
  - test_dry_run_succeeds_on_valid_workflow: `conductor run <path> --dry-run` exits
  0
  - test_dry_run_shows_agent_plan: dry-run plan mentions workflow name and agent names

  Phase 3 — Recent history (2 tests):
  - test_recent_includes_completed_run_with_duration: `conductor list runs --recent
  5`
    shows the completed run with status=completed and non-null duration (~37.5s)
  - test_recent_json_includes_completed_run: JSON output has status=completed,
    non-null duration_seconds > 0, and stable field keys

  End-to-end (1 test):
  - test_full_flow_workflow_to_history: canonical VAL-CROSS-002 test covering all
    three phases in sequence: discover → dry-run → recent history shows completed

  The `_VALID_WORKFLOW_YAML` fixture is a minimal two-agent pipeline workflow
  (researcher → writer) with `workflow.name: test-wf`. Event log simulation uses
  `_write_event_log()` which produces realistic JSONL files with workflow_started
  +
  workflow_completed events. The `_conductor_run_dir` function is patched to point
  at tmp_path, and `read_pid_files` is patched to return [].
