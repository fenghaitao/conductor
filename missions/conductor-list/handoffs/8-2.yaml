      deprecation notice (VAL-M6DEPR-004 satisfied)
  - command: diff <(conductor list checkpoints 2>/dev/null) <(conductor 
      checkpoints 2>/dev/null)
    exit_code: 0
    observation: Stdout identical line-for-line between old and new commands 
      (VAL-M6DEPR-005 satisfied)
