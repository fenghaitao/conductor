salient_summary: 'Feature 8.2 was already implemented by prior work. Verified all
  three validation assertions pass: new `list checkpoints` has no deprecation stderr,
  stdout is identical between old and new commands, and old command remains fully
  functional with correct data.'
what_was_implemented: Prior work already implemented this feature. The new 
  `conductor list checkpoints` command at list_cmd.py:737-758 calls 
  `_list_checkpoints_impl(workflow, json_output)` with NO deprecation notice. 
  The deprecated `checkpoints` command at app.py:988-1021 prints a `[dim]` 
  deprecation notice via `console.print()` then delegates to the same 
  `_list_checkpoints_impl()` function. Both paths produce identical stdout — 
  confirmed by diff comparison showing zero differences. All 174 list tests 
  pass.
