    observation: JSON output identical between old and new; same checkpoint 
      counts, timestamps, error types, agent names
  - command: uv run pytest tests/test_cli/test_list.py -v
    exit_code: 0
    observation: 174 passed in 4.41s — all existing tests pass, no regressions
  interactive_checks:
  - action: uv run conductor list checkpoints
    observed: Rich table with Version, Workflow, Created, Error, Agent columns. 
