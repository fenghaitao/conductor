salient_summary: Verified milestone 1.2 — the `conductor list` summary dashboard
  callback is already fully implemented. It collects counts for running 
  workflows (via read_pid_files), recent runs (via JSONL glob), local workflows 
  (via YAML heuristic), and templates (via template dir scan), then renders a 
  Rich Panel with integer counts and subcommand hints.
what_was_implemented: >
  The `list_summary` callback in `src/conductor/cli/list_cmd.py` (lines 152-223) was
  already
  implemented during milestone 1.1. It gathers four counts: running workflows via
  `read_pid_files()`, recent runs via glob of `conductor-*.events.jsonl` in
  `_conductor_run_dir()`, local workflow YAML files via heuristic frontmatter scan
  (first 2 KB
  for `agents:`, `type: workflow`, or `runtime:`), and templates via `_discover_templates()`.
  Each count is rendered inside a Rich Panel with a dim subcommand hint:
  `(conductor list runs)`, `(conductor list runs --recent)`, `(conductor list workflows)`,
  `(conductor list templates)`. All counts are integers including zero. No Rich table
  headers
  or column lines appear in the summary panel. Exit code is 0. All defensive I/O is
  wrapped
  in try/except with debug logging on failure.
what_was_left_undone: ''
return_to_orchestrator: false
verification:
  commands_run:
  - command: uv run pytest tests/test_cli/test_list.py -v
    exit_code: 0
