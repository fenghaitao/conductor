salient_summary: Feature 7.2 is already fully implemented — all four `list` 
  subcommands with `--json` already produce exactly `[]` (empty JSON array) on 
  stdout when the result set is empty. No code changes were needed.
what_was_implemented: 'Pre-existing implementation verified. All four subcommands
  (`list runs --json`, `list workflows --json`, `list checkpoints --json`, `list templates
  --json`) produce `[]` when results are empty. In `list_cmd.py`: `list_runs` delegates
  to `_output_runs_json()` which builds an empty list and calls `json.dumps([])`;
  `list_workflows` does `print(json.dumps(metas))` with an empty `metas` list; `list_checkpoints`
  does `print(json.dumps(json_data))` with an empty `json_data` list; `list_templates`
  does `print(json.dumps(templates))` with an empty `templates` list. All four paths
  emit `[]` to stdout and exit 0.'
what_was_left_undone: ''
return_to_orchestrator: false
