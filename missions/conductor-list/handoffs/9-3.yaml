salient_summary: 'Wrote 3 integration tests for VAL-CROSS-003 covering the full background
  workflow lifecycle: launch with --web-bg, verify in list runs, stop via port, and
  confirm removal from running table. All tests pass.'
what_was_implemented: >
  Added TestValCross003BackgroundLifecycle class to tests/test_cli/test_list.py with
  3 test methods:

  1. test_full_background_lifecycle — Canonical VAL-CROSS-003 integration test. Creates
  a valid
  workflow YAML in tmp_path, mocks launch_background to return a BackgroundLaunch
  with known
  port/PID/run_id, invokes `conductor run <path> --web-bg`, then verifies `conductor
  list runs`
  shows the entry with correct Port, PID, Workflow, and Dashboard URL columns (both
  table and JSON
  modes). Mocks read_pid_files, os.kill, and remove_pid_file to simulate `conductor
  stop --port 8080`.
  Finally verifies `conductor list runs` shows empty state after stop (both table
  and JSON modes).

  2. test_list_runs_empty_before_any_launch — Verifies graceful empty-state message
  when no
  workflows are running.

  3. test_list_summary_reflects_running_count — Verifies `conductor list` summary
  shows
  running count = 1 with hint after a mock launch.

  Uses unittest.mock.patch for all dependencies (launch_background, read_pid_files,
  os.kill,
  remove_pid_file). No actual process spawning or filesystem writes.
what_was_left_undone: >
  No full end-to-end test with a real background process (would require a live LLM
  provider and
  actual process forking — out of scope for unit/integration tests). The mock coverage
  validates
  the CLI surface contract for all phases of the lifecycle.
return_to_orchestrator: false
