salient_summary: Harden `--recent N` event log scanning against malformed data —
  wrapped `glob()` + `stat()` in `_scan_event_logs` with try/except for 
  `OSError`/`PermissionError`, and added comprehensive mixed-scenario test 
  validating VAL-LRUNS-006 (multiple corrupt records in one invocation exits 0, 
  no traceback, shows only valid entries).
what_was_implemented: >
  Added try/except around `run_dir.glob()` and `sorted(..., key=lambda p: p.stat().st_mtime)`
  in
  `_scan_event_logs()` to catch `OSError` and `PermissionError` when listing or stat'ing
  event log
  files (e.g., file deleted between glob and stat, directory permissions change).
  On failure, logs
  at debug level and returns empty list. Added comprehensive mixed-scenario test
  `test_mixed_valid_and_corrupt_files` that creates a directory with valid, truncated,
  invalid-JSON-only,
  and empty event log files and asserts: exit code 0, no "Traceback" in output, no
  "Error" in output,
  valid entries appear, corrupt file IDs are absent from output. All existing hardening
  from earlier
  milestones (per-file try/except, line-by-line JSON skip, zero-valid-lines return
  None) remains intact.
