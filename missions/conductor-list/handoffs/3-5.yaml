salient_summary: Feature 3.5 (`conductor list workflows --json`) is already 
  fully implemented. The `list_workflows()` command at line 559 branches on 
  `json_output` and calls `print(json.dumps(metas))` to stdout. The 
  `_heuristic_filter()` helper at line 643 builds metadata dicts with all six 
  required fields. All 92 tests pass, including 6 dedicated JSON tests in 
  `TestListWorkflowsJson`.
what_was_implemented: >
  The `--json` flag on `conductor list workflows` was already implemented by a previous
  milestone worker. The `list_workflows()` command (line 559-561) checks `json_output`
  and calls `print(json.dumps(metas))` to emit a JSON array to stdout. Each metadata
  dict from `_heuristic_filter()` (line 643-650) includes `name`, `path`, `agent_count`,
  `has_parallel`, `has_for_each`, `has_pipeline`. When no workflows match, an empty
  JSON array `[]` is printed. No Rich table markup or ANSI escapes appear in JSON
  mode. Exit code is always 0 for the JSON path.
what_was_left_undone: ''
return_to_orchestrator: false
verification:
  commands_run:
  - command: uv run pytest tests/test_cli/test_list.py -v
    exit_code: 0
    observation: All 92 tests passed, including 6 TestListWorkflowsJson tests 
      (valid array, required fields, empty array, no ANSI escapes, topology 
      flags, --all flag)
  - command: uv run conductor list workflows --path examples/ --json | python3 
      -m json.tool
    exit_code: 0
    observation: Valid JSON array of 24 entries, each with 
      name/path/agent_count/has_parallel/has_for_each/has_pipeline fields. No 
      ANSI escapes.
  - command: uv run conductor list workflows --path /tmp --json
    exit_code: 0
    observation: Empty JSON array `[]` when no workflow files found.
  interactive_checks:
  - action: "uv run conductor list workflows --path examples/ --json | python3 -c
      'import json,sys; d=json.load(sys.stdin); assert isinstance(d,list); [assert
      set(e.keys())>={name,path,agent_count,has_parallel,has_for_each,has_pipeline}
      for e in d]; print(f\"VALID: {len(d)} entries\")'"
    observed: 'VALID: 24 entries — all required fields present with correct types
      (str, str, int, bool, bool, bool)'
  - action: uv run conductor list workflows --help
    observed: --json flag shown with description 'Emit machine-readable JSON 
      instead of a table.'
tests_added:
- file: tests/test_cli/test_list.py
  cases:
  - name: test_json_output_is_valid_array
    description: --json emits a valid JSON array
  - name: test_json_has_required_fields
    description: Each object has name, path, agent_count, has_parallel, 
      has_for_each, has_pipeline
  - name: test_json_empty_no_workflows
    description: No matching workflows → empty JSON array []
  - name: test_json_no_rich_markup
    description: JSON output has no ANSI escape codes
  - name: test_json_topology_flags_correct
    description: Topology flags are correct for pipeline, parallel, for_each 
      workflows
  - name: test_json_all_flag_includes_everything
    description: --all --json includes non-workflow YAML files with zero 
      metadata
discovered_issues: []
skill_name: cli-worker
skill_feedback: []
feature_id: '3.5'
