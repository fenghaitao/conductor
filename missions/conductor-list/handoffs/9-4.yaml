salient_summary: Added 5 integration tests for checkpoint discovery and resume 
  flow (VAL-CROSS-004), verifying that checkpoints show file_path/run_id, run 
  history shows completed status with matching run_id, and both exit 0.
what_was_implemented: >
  Added TestCheckpointDiscoveryAndResume class to tests/test_cli/test_list.py with
  5 test methods:
  1. test_checkpoint_shows_file_path_and_run_id — verifies `list checkpoints --json`
  produces entries with file_path, run_id, workflow_path, failure/error_type, current_agent,
  created_at.
  2. test_resumed_run_appears_in_history_with_matching_run_id — creates mocked checkpoint
  with specific run_id (a1b2c3d4) and a temp event log showing a completed run; asserts
  `list runs --recent 1 --json` shows status "completed" with matching run_id, ended_at,
  and positive duration.
  3. test_checkpoint_run_history_both_exit_zero — verifies both `list checkpoints`
  and `list runs --recent 1` exit 0 with no errors on stderr.
  4. test_multiple_checkpoints_and_recent_runs_cross_referenced — 3 checkpoints +
  3 event logs (2 completed, 1 failed); verifies all run_ids cross-reference between
  checkpoint listing and run history, and statuses (completed/failed) are correct.
  5. test_checkpoint_table_shows_file_path_info — verifies the Rich table from `list
  checkpoints` has Version, Workflow, Error, Agent columns and displays the correct
  data.
  Tests use CliRunner with monkeypatch on CheckpointManager.list_checkpoints, _conductor_run_dir,
  and read_pid_files to isolate from the real filesystem. Event logs use temp directories
  with realistic JSONL content. Run IDs use hex format (a1b2c3d4, a0000001, etc.)
  to match real conductor conventions and the filename-based run_id extraction in
  _parse_event_log.
what_was_left_undone: >
  No actual `conductor resume` invocation — the test simulates the post-resume state
  with temp event log files. Running real resume requires LLM provider setup and would
  be covered by a higher-level e2e test with a mock provider.
