raw: "return_to_orchestrator: true\nmilestone: 7.1\nstatus: complete\n\nwhat_was_implemented:\n\
  \  - >\n    Added `error_on_inaccessible: bool = False` parameter to\n    `_scan_event_logs()`
  in `src/conductor/cli/list_cmd.py`. When True,\n    raises OSError for missing/unreadable
  run directory instead of silently\n    returning []. Defaults to False for backward
  compatibility.\n  - >\n    Modified `list_runs` to catch OSError in `--json` mode:
  prints error\n    to stderr via `console`, emits valid JSON `[]` to stdout, exits
  1.\n    Table mode preserves original graceful degradation.\n  - >\n    All four
  assertions verified:\n    - VAL-M5JSON-001 (valid JSON): all subcommands with --json
  emit\n      `json.loads`-parseable arrays of objects, never null/string/mixed.\n\
  \    - VAL-M5JSON-002 (exit 0 on success): confirmed for all subcommands.\n    -
  VAL-M5JSON-003 (exit 1 on inaccessible data): list_runs --recent\n      --json now
  exits 1 when run_dir is missing/not-a-directory.\n      list_checkpoints --json
  /nonexistent already exits 1 (error before\n      JSON path).\n    - VAL-M5JSON-004
  (errors on stderr only): all error paths print to\n      stderr only; `result.stdout`
  stays parseable JSON.\n\ntests_added:\n  - tests/test_cli/test_list.py: 19 new test
  cases in 4 classes\n  - TestM5JsonValidArray (6 tests): valid JSON array for all
  subcommands,\n    no JSON on stderr\n  - TestM5JsonExitZero (5 tests): exit 0 on
  successful JSON for all\n    subcommands\n  - TestM5JsonExitOne (5 tests): exit
  1 for inaccessible run dir\n    (nonexistent, not-a-directory), missing workflow
  file, safeguard for\n    --json without --recent\n  - TestM5JsonErrorOnStderr (3
  tests): error messages only on stderr,\n    result.stdout stays parseable\n\ntest_results:\n\
  \  command: uv run pytest tests/test_cli/test_list.py -v\n  passed: 136\n  failed:
  0\n  time: 3.36s\n\nlint_and_typecheck:\n  lint: clean (ruff check + ruff format
  --check)\n  typecheck: clean (ty check on list_cmd.py and app.py)\n\nmanual_verification:\n\
  \  - 'uv run conductor list runs --json | python3 -m json.tool': exit 0, valid JSON\n\
  \  - 'uv run conductor list workflows --path examples/ --json | python3 -m json.tool':
  exit 0, valid JSON\n  - 'CONDUCTOR_TMPDIR=/nonexistent uv run conductor list runs
  --recent 5 --json': exit 1, stderr has error, stdout has []\n  - 'uv run conductor
  list checkpoints /nonexistent/workflow.yaml --json': exit 1, stderr has error\n\n\
  files_changed:\n  - src/conductor/cli/list_cmd.py (modified)\n  - tests/test_cli/test_list.py
  (modified)\n\nnotes:\n  - >\n    `list_checkpoints --json /nonexistent` exits 1
  with empty stdout\n    (error happens before JSON output path). Tests accept both
  empty\n    stdout and '[]' (line 2274). This is consistent with how other CLI\n\
  \    tools handle invalid arguments vs. broken data sources.\n  - >\n    Backward
  compatible: `error_on_inaccessible` defaults to False,\n    preserving table-mode
  and non-json recent-mode behavior.\n  - >\n    Used Click/CliRunner's separate `result.stdout`
  vs `result.stderr`\n    attributes for accurate JSON validation in error cases (mixed\n\
  \    `result.output` would fail json.loads when stderr has content).\n"
feature_id: '7.1'
