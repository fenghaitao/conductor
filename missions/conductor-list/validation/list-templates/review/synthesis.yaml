- destination: library
  path_suffix: "template-header-format.md"
  content: |-
    ## Template Header Format Convention

    `_parse_template_headers()` in `src/conductor/cli/list_cmd.py` extracts
    metadata from YAML template comment headers for the `conductor list
    templates` command.

    **Format contract:**

    ```yaml
    # <Name>: <optional subtitle>
    #
    # Use when: <description>
    ```

    - The **first comment line** becomes `name` (colon-separated subtitle
      included verbatim, e.g. `"Pipeline template: Sequential stages with
      conditional routing"`).
    - The **first non-empty, non-separator comment** after the name line
      becomes `description`.
    - Separator lines (`#` alone) are skipped.
    - Files lacking this format return `None` and are silently excluded
      from the template listing.

    **Discovered by:** implementation of `conductor list templates` (feature 6.2).
    **Used by:** `_discover_templates()` in `list_cmd.py`.
  operation: create
- destination: library
  path_suffix: "rich-table-testing.md"
  content: |-
    ## Rich Table Output in Pytest Capture Mode

    Rich `Table` objects truncate or wrap column content when stdout is not
    a TTY (e.g. pytest capture mode via `CliRunner`). Long cell values may
    be split across multiple lines, making exact string matching unreliable.

    **Workaround:** Fragment match using the first token before the colon
    (`name.split(":")[0]`) to verify table/JSON consistency.

    **Alternative:** Set `COLUMNS` env var or `width` on the `Console`
    instance to force wide output and avoid truncation:

    ```python
    Console(width=200)
    # or
    os.environ["COLUMNS"] = "200"
    ```

    **Discovered by:** testing `conductor list templates` table output (feature 6.3).
    **Relevant files:** `tests/test_cli/test_list.py` — `test_json_array_length_matches_table_rows`,
    `test_json_and_table_names_same_order`.
  operation: create
