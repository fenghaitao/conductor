  interactive_checks:
  - action: 'Ran `conductor graph examples/test.yaml --depth 0` (workflow with all
      step types: agent, script, set, human_gate, parallel, for-each)'
    observed: 'Output shows: agent rects (`planner["..."]`), script hexagons (`check_env{{"..."}}`),
      human_gate rhombus (`human_review{...}`), set stadiums (`end(["$end"])`), parallel/for-each
      subgraphs, classDef terminateSuccess/Failed, entryPoint bold border'
  - action: Ran `conductor graph examples/wait-step.yaml --depth 0`
    observed: 'Wait step renders as cylinder: `cool_down[("cool_down")]` with waitStep
      class, loop-back dotted edge present'
  - action: Ran `conductor graph examples/terminate.yaml --depth 0`
    observed: 'Terminate steps: `abort_unsafe(...)` with terminateFailed class, `noop_exit(...)`
      with terminateSuccess class'
  - action: Ran `conductor graph examples/parallel-research.yaml --depth 0`
    observed: Parallel group rendered as subgraph with sorted member nodes, 
      outbound edge from subgraph, loop-back edge dotted
  - action: Ran same command twice, diffed outputs
    observed: Byte-identical (deterministic ordering)
