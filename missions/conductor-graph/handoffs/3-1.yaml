- file: tests/test_cli/test_graph.py
  cases:
  - name: test_conditional_route_labeled_edge
    description: 'Edge with when condition gets labeled arrow syntax: A -->|condition|
      B'
  - name: test_unconditional_route_solid_edge
    description: 'Edge without when gets plain arrow: A --> B'
  - name: test_multiple_conditional_routes
    description: Agent with multiple conditional + one fallback route, all 
