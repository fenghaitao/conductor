- destination: library
  path_suffix: graph-path-resolve-quirks.md
  content: "# graph_cmd.py Path.resolve() quirks\n\n## _visited cycle detection\n\n\
    Python Path objects hash by resolved string, so `Path('a/b/../c').resolve() ==
    Path('c').resolve()` works correctly for cycle detection.\n\n## Broken symlink
    edge case\n\n`Path.resolve()` raises `OSError` on broken symlinks. In `graph_cmd.py`,
    `resolved = sub_path.resolve()` at ~line 399 occurs outside the `except Exception`
    block that wraps sub-workflow processing. If a sub-workflow path contains a broken
    symlink, this raises before the exists/cycle check, causing an unhandled exception
    not caught by the bare `except Exception` at line 434.\n\n## Bare except Exception\n\
    \n`graph_cmd.py` uses bare `except Exception` at lines 266 and 434 for 'never
    crash' semantics. This is correct per the feature spec but could silently swallow
    unexpected Python errors (e.g., KeyboardInterrupt). A future refinement could
    log a warning for non-ConductorError exceptions before rendering the error node."
  operation: create
